name: Riepilogo mattutino

# Invia ogni giorno feriale una mail con semafori, scadute e scadenze dei prossimi giorni.
# Richiede questi "Repository secrets" (Settings > Secrets and variables > Actions): DATABASE_URL e, per ogni canale, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_TO (email) e/o SLACK_WEBHOOK_URL (Slack).
# Gli orari di GitHub sono in UTC: 06:00 UTC = 08:00 in estate, 07:00 in inverno. Puo' ritardare di qualche minuto.
on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Invia il riepilogo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python riepilogo.py
